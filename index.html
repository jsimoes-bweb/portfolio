<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSIMOES // Portfolio</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#0f0f0f;
        color:#f5f5f5;
        font-family:Arial, sans-serif;
        min-height:100vh;
        display:flex;
    }

    .sidebar{
        width:320px;
        padding:40px;
        border-right:1px solid #222;
        background:#111;
    }

    h1{
        font-size:24px;
        margin-bottom:10px;
    }

    p{
        color:#888;
        margin-bottom:40px;
        line-height:1.5;
    }

    nav{
        display:flex;
        flex-direction:column;
        gap:12px;
    }

    a{
        color:#ddd;
        text-decoration:none;
        padding:14px 16px;
        border:1px solid #222;
        background:#161616;
        transition:0.2s ease;
        border-radius:10px;
    }

    a:hover{
        background:#222;
        transform:translateX(4px);
    }

    .content{
        flex:1;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#555;
        font-size:18px;
    }

    @media(max-width:768px){

        body{
            flex-direction:column;
        }

        .sidebar{
            width:100%;
            border-right:none;
            border-bottom:1px solid #222;
        }

    }
</style>
</head>

<body>

<div class="sidebar">

    <h1>JSIMOES //</h1>

    <p>
        Portfolio de protótipos, websites e direções visuais.
    </p>

    <nav>

        <a href="./eixo-cenografico/">
            Eixo Cenográfico
        </a>

        <a href="./tatsh/v3/">
            Tatsh Artista Burlesque
        </a>

        <a href="./grafivedras/">
            Grafivedras
        </a>

        <a href="./solar-agraco/">
            Solar Agraço
        </a>

    </nav>

</div>

<div class="content">

    <div>
        Seleciona um projeto.
    </div>

</div>

</body>
</html>
